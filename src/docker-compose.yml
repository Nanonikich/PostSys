# PostSys: PostgreSQL + GraphQL backend.
# Mobile GUI (Android/iOS) is NOT containerized — APK/IPA run on emulator/device.
# Usage (from src/):
#   docker compose up --build -d
# GraphQL: http://localhost:5000/graphql
# Health:  http://localhost:5000/health

name: postsys

networks:
  postsys:
    driver: bridge

volumes:
  postsys-data:
  postsys-pgdata:

services:
  db:
    image: postgres:16-alpine
    container_name: postsys-db
    restart: unless-stopped
    networks:
      - postsys
    volumes:
      - postsys-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${DOCKER_REGISTRY-}postsys-backend
    container_name: postsys-backend
    build:
      context: .
      dockerfile: postSys.service.prj/Dockerfile
    restart: unless-stopped
    networks:
      - postsys
    volumes:
      - postsys-data:/app/data
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      POSTSYS_DATA_DIR: /app/data
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
