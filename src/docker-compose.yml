# PostSys: PostgreSQL + GraphQL backend (+ optional Prometheus/Grafana).
# Secrets: copy .env.example → .env and set strong POSTGRES_PASSWORD / JWT_SIGNING_KEY.
# Mobile GUI is not containerized.
#
#   cd src
#   copy .env.example .env
#   docker compose up --build -d
#   docker compose --profile observability up --build -d

name: postsys

networks:
  postsys:
    driver: bridge

volumes:
  postsys-data:
  postsys-pgdata:
  postsys-prometheus:
  postsys-grafana:

services:
  db:
    image: postgres:16-alpine
    container_name: postsys-db
    restart: unless-stopped
    networks:
      - postsys
    volumes:
      - postsys-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${DOCKER_REGISTRY-}postsys-backend
    container_name: postsys-backend
    build:
      context: .
      dockerfile: postSys.service.prj/Dockerfile
    restart: unless-stopped
    networks:
      - postsys
    volumes:
      - postsys-data:/app/data
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      POSTSYS_DATA_DIR: /app/data
      POSTSYS_RUN_MIGRATIONS: ${POSTSYS_RUN_MIGRATIONS:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env (min 32 chars)}
      Jwt__Issuer: ${JWT_ISSUER:-PostSys}
      Jwt__Audience: ${JWT_AUDIENCE:-PostSys.Gui}
      Cors__Origins__0: ${CORS_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # readiness: процесс + PostgreSQL
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    container_name: postsys-prometheus
    restart: unless-stopped
    networks:
      - postsys
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - postsys-prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.2
    container_name: postsys-grafana
    restart: unless-stopped
    networks:
      - postsys
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - postsys-grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
