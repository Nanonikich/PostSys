"Определяет запросы GraphQL для клиентов."
type Query {
  """
  Возвращает клиента по идентификатору.
  
  **Returns:**
  Клиент, если он существует.
  """
  clientById("Идентификатор." id: UUID!): Client @cost(weight: "10")
  """
  Возвращает всех клиентов.
  
  **Returns:**
  Все клиенты.
  """
  clients(skip: Int take: Int where: ClientFilterInput @cost(weight: "10") order: [ClientSortInput!] @cost(weight: "10")): ClientsCollectionSegment @listSize(assumedSize: 1073741823, slicingArguments: [ "take" ], slicingArgumentDefaultValue: 1073741823, sizedFields: [ "items" ], requireOneSlicingArgument: false) @cost(weight: "10")
  """
  Возвращает посылку по идентификатору.
  
  **Returns:**
  Посылка, если она существует.
  """
  packageById("Идентификатор." id: UUID!): Package @cost(weight: "10")
  """
  Возвращает все посылки.
  
  **Returns:**
  Все посылки.
  """
  packages(skip: Int take: Int where: PackageFilterInput @cost(weight: "10") order: [PackageSortInput!] @cost(weight: "10")): PackagesCollectionSegment @listSize(assumedSize: 1073741823, slicingArguments: [ "take" ], slicingArgumentDefaultValue: 1073741823, sizedFields: [ "items" ], requireOneSlicingArgument: false) @cost(weight: "10")
  """
  Возвращает почтальона по идентификатору.
  
  **Returns:**
  Почтальон, если он существует.
  """
  postmanById("Идентификатор." id: UUID!): Postman @cost(weight: "10")
  """
  Возвращает всех почтальонов.
  
  **Returns:**
  Все почтальоны.
  """
  postmen(skip: Int take: Int where: PostmanFilterInput @cost(weight: "10") order: [PostmanSortInput!] @cost(weight: "10")): PostmenCollectionSegment @listSize(assumedSize: 1073741823, slicingArguments: [ "take" ], slicingArgumentDefaultValue: 1073741823, sizedFields: [ "items" ], requireOneSlicingArgument: false) @cost(weight: "10")
}

