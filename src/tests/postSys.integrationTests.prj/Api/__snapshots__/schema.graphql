"Определяет запросы GraphQL для клиентов."
type Query {
  "Возвращает клиента по идентификатору."
  clientById(id: UUID!): Client @cost(weight: "10")
  "Возвращает всех клиентов."
  clients(
    skip: Int
    take: Int
    where: ClientFilterInput @cost(weight: "10")
    order: [ClientSortInput!] @cost(weight: "10")
  ): ClientsCollectionSegment
    @listSize(
      assumedSize: 1073741823
      slicingArguments: ["take"]
      slicingArgumentDefaultValue: 1073741823
      sizedFields: ["items"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  """
  Возвращает клиента по идентификатору.
  
  **Returns:**
  Клиент, если он существует.
  """
  version: String! @cost(weight: "10")
  "Возвращает посылку по идентификатору."
  packageById(id: UUID!): Package @cost(weight: "10")
  "Возвращает все посылки."
  packages(
    skip: Int
    take: Int
    where: PackageFilterInput @cost(weight: "10")
    order: [PackageSortInput!] @cost(weight: "10")
  ): PackagesCollectionSegment
    @listSize(
      assumedSize: 1073741823
      slicingArguments: ["take"]
      slicingArgumentDefaultValue: 1073741823
      sizedFields: ["items"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  "Возвращает почтальона по идентификатору."
  postmanById(id: UUID!): Postman @cost(weight: "10")
  "Возвращает всех почтальонов."
  postmen(
    skip: Int
    take: Int
    where: PostmanFilterInput @cost(weight: "10")
    order: [PostmanSortInput!] @cost(weight: "10")
  ): PostmenCollectionSegment
    @listSize(
      assumedSize: 1073741823
      slicingArguments: ["take"]
      slicingArgumentDefaultValue: 1073741823
      sizedFields: ["items"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  "Авторизует почтальона по email и паролю."
  authorizePostman(email: String!, password: String!): UUID @cost(weight: "10")
}

"Определяет мутации для клиентов."
type Mutation {
  "Создает клиента."
  createClient(input: CreateClientInput!): CreateClientPayload!
    @cost(weight: "10")
  "Обновляет данные об имени клиента."
  changeClientFullname(input: ChangeClientFullnameInput!): ChangeClientFullnamePayload!
    @cost(weight: "10")
  "Обновляет номер телефона клиента."
  changeClientPhoneNumber(input: ChangeClientPhoneNumberInput!): ChangeClientPhoneNumberPayload!
    @cost(weight: "10")
  "Удаляет клиента."
  deleteClient(input: DeleteClientInput!): DeleteClientPayload!
    @cost(weight: "10")
  "Создает посылку."
  createPackage(input: CreatePackageInput!): CreatePackagePayload!
    @cost(weight: "10")
  "Обновляет данные о посылке."
  changePackage(input: ChangePackageInput!): ChangePackagePayload!
    @cost(weight: "10")
  "Обновляет параметры посылки."
  changePackageDimensions(input: ChangePackageDimensionsInput!): ChangePackageDimensionsPayload!
    @cost(weight: "10")
  "Обновляет местоположение посылки."
  changePackageAddress(input: ChangePackageAddressInput!): ChangePackageAddressPayload!
    @cost(weight: "10")
  "Обновляет статус посылки."
  changePackageStatus(input: ChangePackageStatusInput!): ChangePackageStatusPayload!
    @cost(weight: "10")
  "Удаляет посылку."
  deletePackage(input: DeletePackageInput!): DeletePackagePayload!
    @cost(weight: "10")
  "Создает почтальона."
  createPostman(input: CreatePostmanInput!): CreatePostmanPayload!
    @cost(weight: "10")
  "Обновляет данные почтальона."
  changePostman(input: ChangePostmanInput!): ChangePostmanPayload!
    @cost(weight: "10")
  "Обновляет данные об имени почтальона."
  changePostmanFullname(input: ChangePostmanFullnameInput!): ChangePostmanFullnamePayload!
    @cost(weight: "10")
  "Обновляет Email почтальона."
  changePostmanEmail(input: ChangePostmanEmailInput!): ChangePostmanEmailPayload!
    @cost(weight: "10")
  "Обновляет пароль почтальона."
  changePostmanPassword(input: ChangePostmanPasswordInput!): ChangePostmanPasswordPayload!
    @cost(weight: "10")
  "Удаляет почтальона."
  deletePostman(input: DeletePostmanInput!): DeletePostmanPayload!
    @cost(weight: "10")
}

"Менеджер подписок HotChocolate."
type Subscription {
  """
  Обработчик создания сущности.
  
  **Returns:**
  Модель сообщения, отправляемого подписчикам.
  """
  onEntityCreated: EntityCreationMessageModel!
  """
  Обработчик изменения сущности.
  
  **Returns:**
  Модель сообщения, отправляемого подписчикам.
  """
  onEntityChanged: EntityChangeMessageModel!
  """
  Обработчик изменения параметра сущности.
  
  **Returns:**
  Модель сообщения, отправляемого подписчикам.
  """
  onEntityParameterChanged: EntityParameterChangeMessageModel!
  """
  Обработчик создания сущности.
  
  **Returns:**
  Модель сообщения, отправляемого подписчикам.
  """
  onEntityDeleted: EntityDeletionMessageModel!
}

