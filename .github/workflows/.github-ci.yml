name: PostSys CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./src/PostSys.sln

      - name: Build solution
        run: dotnet build ./src/PostSys.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test ./src/tests/postSys.unitTests.prj/postSys.unitTests.csproj --configuration Release --no-build --no-restore
