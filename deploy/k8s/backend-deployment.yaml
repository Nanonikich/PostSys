# Пример развёртывания backend для оркестратора.
# Секреты и строка подключения задаются отдельно (Secret / ConfigMap).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postsys-backend
  labels:
    app: postsys-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postsys-backend
  template:
    metadata:
      labels:
        app: postsys-backend
    spec:
      containers:
        - name: backend
          image: postsys-backend:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: POSTSYS_RUN_MIGRATIONS
              value: "false"
          startupProbe:
            httpGet:
              path: /liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postsys-backend
spec:
  selector:
    app: postsys-backend
  ports:
    - name: http
      port: 80
      targetPort: http
